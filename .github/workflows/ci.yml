name: Guardian Exams CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check API JavaScript syntax
        run: for file in server/*.mjs; do node --check "$file"; done
      - name: Build frontend and check TypeScript
        run: npm run build
      - name: Build production API image
        run: docker build --tag guardian-exams-api:ci .
